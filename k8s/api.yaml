apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: worksoft
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: worksoft-api:latest
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: worksoft-secrets
                  key: CONNECTION_STRING
            - name: Redis__ConnectionString
              valueFrom:
                configMapKeyRef:
                  name: worksoft-config
                  key: REDIS_CONNECTION
            - name: Redis__InstanceName
              valueFrom:
                configMapKeyRef:
                  name: worksoft-config
                  key: REDIS_INSTANCE
            - name: Jwt__SecretKey
              valueFrom:
                secretKeyRef:
                  name: worksoft-secrets
                  key: JWT_SECRET_KEY
            - name: Jwt__Issuer
              valueFrom:
                configMapKeyRef:
                  name: worksoft-config
                  key: JWT_ISSUER
            - name: Jwt__Audience
              valueFrom:
                configMapKeyRef:
                  name: worksoft-config
                  key: JWT_AUDIENCE
            - name: Jwt__ExpireMinutes
              valueFrom:
                configMapKeyRef:
                  name: worksoft-config
                  key: JWT_EXPIRE_MINUTES
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: worksoft
spec:
  selector:
    app: api
  ports:
    - port: 5000
      targetPort: 8080
  type: ClusterIP